name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: pnpm-lock.yaml

      - name: Prepare Nuxt types
        run: pnpm run prepare

      - name: Format migration
        run: pnpm run lint:fix

      - name: Capture formatting patch
        if: always()
        run: git diff -- . ':!pnpm-lock.yaml' > formatting.patch

      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting.patch

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build

      - name: Install browser for editor smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify deployment artifact
        run: node scripts/verify-build.mjs
