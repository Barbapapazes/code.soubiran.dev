# The pinned Nuxt preview packages depend on other pkg.pr.new tarballs.
blockExoticSubdeps: false
trustPolicy: off
shellEmulator: true

# Temporary fix for the pinned Nuxt preview: finalize SPA assets in Vite's
# resolved client outDir, which Cloudflare redirects to its build output.
patchedDependencies:
  '@nuxt/vite-server@4.6.0': patches/@nuxt__vite-server@4.6.0.patch

allowBuilds:
  core-js-pure: false
  esbuild: false
  sharp: false
  vue-demi: false
  workerd: false
