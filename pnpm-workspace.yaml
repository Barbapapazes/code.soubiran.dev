blockExoticSubdeps: false
trustPolicy: off
shellEmulator: true

# Temporary fix for the pinned Nuxt preview: finalize SPA assets in Vite's
# resolved client outDir, which Cloudflare redirects to its build output.
patchedDependencies:
  '@nuxt/vite-server@4.6.0': patches/@nuxt__vite-server@4.6.0.patch
  # Reconcile inferred custom-domain zones/default flags in cf's strict deploy
  # comparison. Keep strict mode enabled for genuine remote configuration drift.
  cf@1.0.0-beta.12: patches/cf@1.0.0-beta.12.patch

allowBuilds:
  core-js-pure: false
  esbuild: false
  sharp: false
  vue-demi: false
  workerd: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.2.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.2.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.2.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.2.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0'
  - vite-plus@1.2.0
